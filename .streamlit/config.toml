[server]
maxUploadSize = 10
headless = true
# serves ./static (fonts and logo) at /app/static/
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Sentiq design system (docs/DESIGN_SYSTEM.md): Ivory, Burgundy and Sage. Light is the default;
# viewers can switch to dark under the app menu, Settings.
[theme]
base = "light"
font = "IBM Plex Sans, sans-serif"
headingFont = "Fraunces, serif"
codeFont = "IBM Plex Mono, monospace"
baseRadius = "none"
showWidgetBorder = true
showSidebarBorder = true

[[theme.fontFaces]]
family = "Fraunces"
url = "app/static/fonts/Fraunces-Variable.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Fraunces"
url = "app/static/fonts/Fraunces-Variable-Italic.woff2"
weight = "100 900"
style = "italic"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-400.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-400-Italic.woff2"
weight = 400
style = "italic"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-500.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-600.woff2"
weight = 600
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-400.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-500.woff2"
weight = 500
style = "normal"

